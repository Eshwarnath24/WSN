<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 Wireless Sensor Network // Live Telemetry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
  <!-- TOP TELEMETRY BAR -->
  <header class="top-nav">
    <div class="nav-left">
      <div class="brand-chip-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="2" />
          <rect x="9" y="9" width="6" height="6" />
          <line x1="9" y1="1" x2="9" y2="4" />
          <line x1="15" y1="1" x2="15" y2="4" />
          <line x1="9" y1="20" x2="9" y2="23" />
          <line x1="15" y1="20" x2="15" y2="23" />
          <line x1="20" y1="9" x2="23" y2="9" />
          <line x1="20" y1="14" x2="23" y2="14" />
          <line x1="1" y1="9" x2="4" y2="9" />
          <line x1="1" y1="14" x2="4" y2="14" />
        </svg>
      </div>
      <h1 class="brand-title">ESP32 Wireless Sensor Network</h1>
      <div class="live-pill">
        <span class="pulse-dot"></span>
        <span class="live-text">LIVE</span>
      </div>
    </div>

    <div class="nav-right">
      <div class="stat-item active-nodes-item">
        <span class="dot-green"></span>
        <span class="stat-label">Active Nodes:</span>
        <span class="stat-val active-count" id="active-count">0/3</span>
      </div>
      <div class="nav-divider"></div>
      <div class="stat-item total-packets-item">
        <svg class="icon-db" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6c0 1.657 3.582 3 8 3s8-1.343 8-3-3.582-3-8-3-8 1.343-8 3z" />
          <path d="M4 6v6c0 1.657 3.582 3 8 3s8-1.343 8-3V6" />
          <path d="M4 12v6c0 1.657 3.582 3 8 3s8-1.343 8-3v-6" />
        </svg>
        <span class="stat-label">Total Packets:</span>
        <span class="stat-val" id="total-packets">0</span>
      </div>
    </div>
  </header>

  <main class="dashboard-content">


    <!-- SENSOR NODES CONTAINER -->
    <section class="nodes-stream" id="grid">
      <!-- Generated dynamically by node-card.js -->
    </section>
  </main>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
